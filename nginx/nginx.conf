events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 200M;
    sendfile on;
    keepalive_timeout 65;

    # DNS resolver dinámico de Docker (re-evalúa IPs cada 10s para evitar 502 Bad Gateway)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # API
        location /api/ {
            set $backend_target "http://backend:8000";
            proxy_pass $backend_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Static media (covers, audio)
        location /data/covers/ {
            alias /data/covers/;
            expires 7d;
        }

        location /data/audio/ {
            alias /data/audio/;
            add_header Accept-Ranges bytes;
        }

        # Frontend
        location / {
            set $frontend_target "http://frontend:3000";
            proxy_pass $frontend_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
