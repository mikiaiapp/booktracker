<html lang="es">

    <meta name="description" content="Organiza tu biblioteca, genera resúmenes con IA y escucha podcasts personalizados de tus libros favoritos." />

    <!-- Fuentes premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
      :root {
        --ink: #0d0d0d; --paper: #f5f0e8; --gold: #c9a96e; --cream: #faf7f2;
        --paper-dark: #ede6d6; --mist: #8a9aaa; --radius: 4px;
      }
      body { margin: 0; padding: 0; background: var(--cream); font-family: system-ui, sans-serif; }
      .layout { display: flex; min-height: 100vh; }
      .sidebar { 
        width: 240px; min-height: 100vh; background: var(--ink); color: var(--paper);
        display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100;
      }
      .main-content { margin-left: 240px; flex: 1; padding: 2rem; min-height: 100vh; }
      .sidebar-nav { padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
      .nav-item { 
        display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; 
        color: var(--mist); text-decoration: none; border-radius: var(--radius);
      }
      .nav-item.active { background: rgba(201,169,110,0.15); color: var(--gold); }
      .sidebar-brand-premium { padding: 2rem 1rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .brand-text { font-size: 1.25rem; font-weight: 800; letter-spacing: 2px; color: var(--paper); text-transform: uppercase; display: block; }
      .sidebar-logo-footer-large { width: 120px; height: auto; display: block; margin: 2rem auto; opacity: 0.9; transition: transform 0.3s; }
      .sidebar-logo-footer-large:hover { transform: scale(1.05); }
      .sidebar-footer { padding: 1.5rem 1rem; border-top: 1px solid rgba(255,255,255,0.08); margin-top: auto; }
      .user-badge { display: flex; align-items: center; gap: 0.75rem; font-family: 'DM Sans', sans-serif; }
      .user-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255,255,255,0.05); }
      .user-info { display: flex; flex-direction: column; min-width: 0; }
      .user-name { font-size: 0.85rem; font-weight: 700; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .user-email { font-size: 0.75rem; color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .logout-btn { background: none; border: none; color: var(--mist); padding: 0.5rem; transition: color 0.2s; cursor: pointer; display: flex; align-items: center; }
      .logout-btn:hover { color: #e74c3c; }
      .read-status-overlay { position: absolute; bottom: 8px; right: 8px; z-index: 10; background: rgba(13,13,13,0.6); padding: 4px; border-radius: 50%; line-height: 0; backdrop-filter: blur(4px); }
      .hero-cover { width: 220px; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; margin-bottom: 2rem; }
      .hero-poster { width: 100%; height: auto; display: block; }

      /* Premium Pages System */
      .premium-page { padding: 3rem; max-width: 1200px; margin: 0 auto; min-height: 100vh; background: var(--cream); color: var(--ink); font-family: 'DM Sans', sans-serif; }
      .premium-header { margin-bottom: 2.5rem; }
      .premium-header h1 { font-family: var(--font-display); font-size: 2.5rem; margin: 0.5rem 0; color: var(--ink); }
      .premium-card { background: white; border: 1.5px solid var(--paper-dark); border-radius: 12px; padding: 2rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; transition: transform 0.2s, border-color 0.2s; }
      .premium-card:hover { border-color: var(--gold); }
      .premium-input { 
        width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--paper-dark); border-radius: 8px; 
        font-family: inherit; font-size: 0.95rem; background: var(--faf7f2); color: var(--ink); transition: all 0.2s;
      }
      .premium-input:focus { outline: none; border-color: var(--gold); background: white; box-shadow: 0 0 0 3px rgba(201,169,110,0.1); }
      .premium-label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--mist); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
      .premium-btn { 
        padding: 0.85rem 1.5rem; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; 
        display: inline-flex; align-items: center; gap: 0.6rem; transition: all 0.2s; font-family: inherit;
      }
      .premium-btn.primary { background: var(--gold); color: white; }
      .premium-btn.primary:hover { background: #b8985e; transform: translateY(-1px); }
      .premium-btn.secondary { background: var(--ink); color: white; }
      .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--mist); text-decoration: none; font-size: 0.9rem; font-weight: 500; margin-bottom: 1rem; transition: color 0.2s; }
      .back-link:hover { color: var(--ink); }
      
      @media (max-width: 768px) {
        .sidebar { width: 100%; height: auto; bottom: 0; top: auto; flex-direction: row; position: fixed; }
        .main-content { margin-left: 0; margin-bottom: 70px; }
      }
    </style>
    </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <!-- Deslizar hacia abajo para actualizar (plantilla común de las apps) -->
<script>
/* Deslizar hacia abajo desde arriba para actualizar (pull-to-refresh) — plantilla común de las apps de mikiaiapp.
   Sin dependencias. Solo en pantallas táctiles. Se pega tal cual en cada app (script al final de <body>).
   - Solo actúa si se desliza con UN dedo desde lo más alto de la página (ninguna zona con scroll está desplazada).
   - No actúa sobre campos de texto, mapas, lienzos, elementos arrastrables, ventanas modales ni zonas con data-no-ptr.
   - Al soltar pasado el umbral lanza el evento «ptr:refresh»; si nadie lo cancela (preventDefault), recarga la página.
   - Con dos dedos (zoom con la pinza) no hace nada. */
(function () {
  var tactil = ('ontouchstart' in window) || ((navigator.maxTouchPoints || 0) > 0);
  if (window.__ptr || !tactil) return;
  window.__ptr = true;
  var UMBRAL = 80, y0 = null, dy = 0, activo = false, ind = null, ocupado = false;

  // Evita el refresco nativo del navegador (que duplicaría este) y las gomas de rebote de la página
  document.documentElement.style.overscrollBehaviorY = 'contain';
  // iOS amplía la pantalla al enfocar un campo con letra menor de 16 px: se evita para que el zoom con los dedos no estorbe
  var st = document.createElement('style');
  st.textContent = '@supports (-webkit-touch-callout:none){input,select,textarea{font-size:max(16px,1em)!important}}';
  document.head.appendChild(st);

  function indicador() {
    if (ind) return ind;
    ind = document.createElement('div');
    ind.setAttribute('aria-hidden', 'true');
    ind.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate(-50%,-70px);z-index:2147483647;' +
      'background:#0f172a;color:#fff;font:600 13px/1 system-ui,-apple-system,sans-serif;padding:9px 16px;border-radius:999px;' +
      'box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;white-space:nowrap';
    document.body.appendChild(ind);
    return ind;
  }
  function mostrar(texto, px) {
    var i = indicador();
    i.textContent = texto;
    i.style.opacity = Math.min(1, px / 50);
    i.style.transform = 'translate(-50%,' + (Math.min(px, 90) * 0.6 - 70) + 'px)';
  }
  function ocultar() { if (ind) { ind.style.opacity = '0'; ind.style.transform = 'translate(-50%,-70px)'; } }
  function reiniciar() { y0 = null; dy = 0; activo = false; ocultar(); }

  // true = no empezar aquí (zona con otro significado o la página no está arriba del todo)
  function descartar(el) {
    var raiz = document.scrollingElement || document.documentElement;
    if ((window.scrollY || 0) > 0 || raiz.scrollTop > 0) return true;
    for (var e = el; e && e.nodeType === 1 && e !== document.documentElement; e = e.parentElement) {
      if (e.hasAttribute('data-no-ptr') || e.draggable) return true;
      var t = e.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || t === 'CANVAS' || t === 'IFRAME' || t === 'VIDEO' || t === 'AUDIO') return true;
      if (e.getAttribute('role') === 'dialog' || e.getAttribute('aria-modal') === 'true') return true;
      var c = e.className && e.className.baseVal === undefined ? String(e.className) : '';
      if (/leaflet-container|\bmodal\b|\bdialog\b|\boverlay\b|\binset-0\b/.test(c)) return true;
      var cs = getComputedStyle(e);
      if (/(auto|scroll)/.test(cs.overflowY) && e.scrollHeight > e.clientHeight + 1 && e.scrollTop > 0) return true;
    }
    return false;
  }

  document.addEventListener('touchstart', function (ev) {
    if (ocupado) return;
    if (ev.touches.length !== 1 || descartar(ev.target)) { reiniciar(); return; }
    y0 = ev.touches[0].clientY; dy = 0; activo = false;
  }, { passive: true });

  document.addEventListener('touchmove', function (ev) {
    if (y0 === null || ocupado) return;
    if (ev.touches.length !== 1) { reiniciar(); return; }          // segundo dedo: es un zoom
    dy = ev.touches[0].clientY - y0;
    if (dy < -5) { reiniciar(); return; }                           // el usuario sube: es un scroll normal
    if (dy > 10) { activo = true; mostrar(dy > UMBRAL ? '↻ Suelta para actualizar' : '↓ Sigue bajando para actualizar', dy); }
  }, { passive: true });

  function soltar() {
    if (activo && dy > UMBRAL && !ocupado) {
      ocupado = true;
      mostrar('Actualizando…', 100);
      var cancelado = !window.dispatchEvent(new CustomEvent('ptr:refresh', { cancelable: true }));
      if (cancelado) { setTimeout(function () { ocupado = false; reiniciar(); }, 800); } else { location.reload(); }
    } else { reiniciar(); }
    y0 = null; dy = 0; activo = false;
  }
  document.addEventListener('touchend', soltar, { passive: true });
  document.addEventListener('touchcancel', reiniciar, { passive: true });
})();
</script>
